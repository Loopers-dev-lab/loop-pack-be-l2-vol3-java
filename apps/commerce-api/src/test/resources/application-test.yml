# 테스트 환경 Kafka 토픽 설정
# Docker Kafka 단일 브로커 (docker/infra-compose.yml)

kafka:
  topic:
    catalog-events:
      name: catalog-events-v1
      partitions: 3
      replicas: 1
      min-insync-replicas: 1

    order-events:
      name: order-events-v1
      partitions: 3
      replicas: 1
      min-insync-replicas: 1

    coupon-issue-requests:
      name: coupon-issue-requests-v1
      partitions: 3
      replicas: 1
      min-insync-replicas: 1

    user-activity-events:
      name: user-activity-events-v1
      partitions: 3
      replicas: 1
      min-insync-replicas: 1
      retention-ms: 259200000

    pipeline-dlq:
      name: pipeline-dlq-v1
      partitions: 1
      replicas: 1
      min-insync-replicas: 1
      retention-ms: 2592000000
