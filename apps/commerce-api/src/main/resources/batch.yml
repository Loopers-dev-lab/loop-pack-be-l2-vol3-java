spring:
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # 애플리케이션 시작 시 Job 자동 실행 비활성화

batch:
  scheduler:
    enabled: false  # 기본값: 스케줄러 비활성화
    weekly-cron: "0 0 2 ? * MON"   # 매주 월요일 새벽 2시
    monthly-cron: "0 0 3 1 * ?"    # 매월 1일 새벽 3시

---
spring.config.activate.on-profile: local

spring:
  batch:
    jdbc:
      initialize-schema: always

batch:
  scheduler:
    enabled: false  # 로컬에서는 수동 실행

---
spring.config.activate.on-profile: test

spring:
  batch:
    jdbc:
      initialize-schema: always

batch:
  scheduler:
    enabled: false  # 테스트에서는 스케줄러 비활성화

---
spring.config.activate.on-profile: dev

spring:
  batch:
    jdbc:
      initialize-schema: always

batch:
  scheduler:
    enabled: false  # 개발 환경에서는 수동 실행

---
spring.config.activate.on-profile: qa, prd

spring:
  batch:
    jdbc:
      initialize-schema: never  # 운영 환경에서는 수동 스키마 관리

batch:
  scheduler:
    enabled: true  # 운영 환경에서만 스케줄러 활성화