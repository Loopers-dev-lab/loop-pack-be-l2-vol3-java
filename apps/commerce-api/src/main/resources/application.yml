server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

pg:
  simulator:
    url: http://localhost:8082

payment:
  callback-url: http://localhost:8080/api/v1/payments/callback

feign:
  client:
    config:
      pg-client:
        connectTimeout: 1000
        readTimeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      pgCircuit:
        failure-rate-threshold: 50           # 실패율 50% 초과 시 Open
        sliding-window-size: 10              # 최근 10개 요청 기준
        wait-duration-in-open-state: 10s     # Open 후 10초 뒤 Half-Open 전환
        permitted-number-of-calls-in-half-open-state: 3  # Half-Open 시 3개 요청만 허용
        slow-call-duration-threshold: 3s     # 3초 이상 응답도 실패로 간주
        slow-call-rate-threshold: 50         # 느린 호출 50% 초과 시 Open
  retry:
    instances:
      pgRetry:
        max-attempts: 3                      # 최대 3회 시도
        wait-duration: 1s                    # 재시도 간격 1초
        retry-exceptions:
          - feign.FeignException
          - com.loopers.infrastructure.client.PgPaymentException

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false