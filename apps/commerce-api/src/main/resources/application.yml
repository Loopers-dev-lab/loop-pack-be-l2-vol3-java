server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml
  cloud:
    openfeign:
      client:
        config:
          pgSimulatorPayClient:
            connectTimeout: 1000
            readTimeout: 3000
            loggerLevel: basic
          pgSimulatorCancelClient:
            connectTimeout: 1000
            readTimeout: 3000
            loggerLevel: basic
          pgSimulatorQueryClient:
            connectTimeout: 1000
            readTimeout: 3000
            loggerLevel: basic

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

cache:
  public-product-detail:
    enabled: true
    ttl: 30s
    jitter-enabled: false
    jitter-ratio: 0.1

loopers:
  queue:
    order:
      enabled: false
      throughput-per-second: 1
      scheduler-enabled: true
      scheduler-fixed-delay-ms: 1000
      initial-batch-size: 10
      max-active-admissions: 100
      dynamic-adjustment-enabled: true
      claim-ttl-ms: 5000
      token-ttl-ms: 30000
      admission-strategy: key-ttl
  cache:
    brand-category:
      enabled: true
  payment:
    pg-simulator:
      url: http://localhost:8082
    completion:
      polling:
        enabled: true
        fixed-delay-ms: 5000
        requested-min-age-ms: 15000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      pg-request:
        baseConfig: default
      pg-cancel:
        baseConfig: default
      pg-query:
        baseConfig: default
  retry:
    instances:
      pg-request-connection:
        maxAttempts: 1
        waitDuration: 150ms
        retryExceptions:
          - com.loopers.infrastructure.payment.PaymentGatewayConnectionException
      pg-cancel-connection:
        maxAttempts: 1
        waitDuration: 150ms
        retryExceptions:
          - com.loopers.infrastructure.payment.PaymentGatewayConnectionException
      pg-query-connection:
        maxAttempts: 2
        waitDuration: 100ms
        retryExceptions:
          - com.loopers.infrastructure.payment.PaymentGatewayConnectionException

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: test

loopers:
  queue:
    order:
      scheduler-fixed-delay-ms: 60000
  payment:
    completion:
      polling:
        enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
