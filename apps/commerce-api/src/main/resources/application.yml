server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  task:
    scheduling:
      pool:
        size: 2  # OutboxRelayScheduler + EntryTokenScheduler 동시 실행을 위한 스레드 풀 확장

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

pg:
  base-url: http://localhost:8082  # PG 시뮬레이터 주소
  callback-url: http://localhost:8080/api/v1/payments/callback  # PG → 우리 서버 콜백 URL

resilience4j:
  # ────────────────────────────────────────────────────────────────────────────
  # Aspect 실행 순서: CB(1) > Retry(2) → CB(Retry(call)) 구조
  # Spring AOP에서 낮은 숫자 = 더 바깥쪽(먼저 실행)
  #
  # [중요] CB가 Retry 바깥에 있어야 하는 이유:
  #   Retry(CB(call)) 구조라면 재시도 1회마다 CB에 실패가 기록 → CB가 의도보다 빨리 OPEN됨
  #   CB(Retry(call)) 구조라면 Retry 전체가 끝난 뒤 최종 결과를 CB에 1건만 기록
  #
  # [Resilience4j 기본 순서] Retry(CB(call)) — 이 설정 없으면 기본값이 적용되어 순서 역전
  # ────────────────────────────────────────────────────────────────────────────
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      pgPaymentRequest:                     # 결제 요청 전용 서킷
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10             # 최근 10건 기준 실패율 평가
        minimum-number-of-calls: 5          # 최소 5건 호출 후 서킷 평가 시작
        failure-rate-threshold: 50          # 실패율 50% 이상이면 OPEN
        wait-duration-in-open-state: 30s    # OPEN 후 30초 대기 후 HALF_OPEN 전이
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        # [recordExceptions] CB 실패로 카운트할 예외 타입을 명시
        # 지정하지 않으면 모든 예외가 CB 실패로 카운트됨 (코드 버그도 PG 장애로 오인될 수 있음)
        # [recordExceptions] RestClient는 I/O 에러를 ResourceAccessException으로 감싸서 던짐
        # ConnectException/SocketTimeoutException 직접 매칭 불가 → ResourceAccessException 필수
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException      # I/O 에러 (연결 실패, 타임아웃 등)
          - org.springframework.web.client.HttpServerErrorException     # PG 5xx 에러
      pgPaymentStatus:                      # 상태 확인 전용 서킷
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  retry:
    retry-aspect-order: 2
    instances:
      pgPaymentRequest:                     # 결제 요청 전용 리트라이
        max-attempts: 2                     # 최대 2회 시도 (원본 1회 + 재시도 1회)
        wait-duration: 500ms
        # [retry-exceptions] Java Config(ResilienceRetryConfig)에서 커스텀 Predicate로 설정
        # SocketTimeoutException 시 재시도 방지 (중복 결제 위험) — ConnectException/5xx만 재시도
      pgPaymentStatus:                      # 상태 확인 전용 리트라이
        max-attempts: 3                     # 상태 확인은 부작용 없으므로 3회까지 시도
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException      # I/O 에러 (연결 실패, 타임아웃 포함)
          - org.springframework.web.client.HttpServerErrorException

queue:
  batch-size: 14                # 스케줄러 1회 발급 인원 (TPS 산정: 40커넥션 / 0.2s × 0.7 / 10회/초 = 140TPS → 100ms당 14명)
  token-ttl-seconds: 300        # 입장 토큰 TTL 5분 (보수적 초기값, 모니터링 후 조정)
  scheduler-interval-ms: 100    # 스케줄러 실행 간격 (Thundering Herd 완화를 위한 분산 발급)

cache:
  default-ttl-seconds: 300  # 기본 TTL 5분
  jitter-range-seconds: 30  # ±30초 무작위 오차 → 동시 만료 방지 (캐시 스탬피드 완화)
  max-cacheable-page: 3     # page=0,1,2 만 캐싱 (딥 페이징 캐시 키 폭발 방지)
  ttl-overrides:
    product:list: 180        # 상품 목록 캐시 TTL 3분 (좋아요 수 변경 허용 stale 범위)
    product:detail: 60       # 상품 상세 캐시 TTL 1분 (민감 정보는 이벤트로 즉시 무효화, TTL은 likeCount stale 허용 범위)
    ranking: 30              # 랭킹 캐시 TTL 30초 (RankingSyncScheduler 5초 주기 대비 적절한 stale 허용 범위)

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false