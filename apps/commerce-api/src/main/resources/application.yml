server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

pg:
  base-url: http://localhost:8082

payment:
  callback-url: http://localhost:8080/api/v1/payments/callback

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 60              # 실험2 도출: 정상 실패율(40%) + 마진(20%)
        slowCallDurationThreshold: 1s         # 요청 p99(500ms) × 2배
        slowCallRateThreshold: 60             # failureRate와 동일 기준
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
    instances:
      pg-command:
        baseConfig: default
      pg-query:
        baseConfig: default

  retry:
    retryAspectOrder: 2
    instances:
      pg-query:
        maxAttempts: 3
        waitDuration: 200ms                   # 실험3 도출: 500ms → 200ms
        enableExponentialBackoff: true         # 실험3 도출: Exponential Backoff
        exponentialBackoffMultiplier: 2.0      # 200 → 400 → 800ms
        enableRandomizedWait: true            # 실험3 도출: Jitter로 부하 분산
        randomizedWaitFactor: 0.5             # ±50% 변동

  timelimiter:
    instances:
      pg-command:
        timeoutDuration: 2s                   # 실험1 도출: 5s → 2s
      pg-query:
        timeoutDuration: 2s                   # 실험1 도출: 3s → 2s

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false