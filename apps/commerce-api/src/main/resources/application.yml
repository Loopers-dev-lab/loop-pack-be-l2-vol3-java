server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

pg:
  simulator:
    base-url: http://localhost:8082
    callback-base-url: http://localhost:8080

# ── Resilience4j ──────────────────────────────────────────────
# 기본 Aspect 순서 (바깥→안쪽): Retry → CircuitBreaker → RateLimiter → TimeLimiter → Bulkhead
# 현재 사용: CB(Facade) + Bulkhead(Facade) + Retry(Client.query) — 메서드 분리로 순서 충돌 회피
resilience4j:
  circuitbreaker:
    instances:
      pgPayment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 60s               # 함정7 방지: 0이면 느린 탐색 요청이 슬롯 점유 시 HALF_OPEN 무한 대기
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.loopers.domain.payment.PgServerException
          - com.loopers.domain.payment.PgTimeoutException
        ignore-exceptions:
          - com.loopers.domain.payment.PgClientException
          - com.loopers.support.error.CoreException
          - io.github.resilience4j.bulkhead.BulkheadFullException

      queueRedis:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.data.redis.RedisConnectionFailureException
        ignore-exceptions:
          - com.loopers.support.error.CoreException

  bulkhead:
    instances:
      pgPayment:
        max-concurrent-calls: 20
        max-wait-duration: 0

  retry:
    instances:
      pgQuery:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.loopers.domain.payment.PgTimeoutException
          - com.loopers.domain.payment.PgServerException
        ignore-exceptions:
          - com.loopers.domain.payment.PgClientException

# ── Queue (대기열) ─────────────────────────────────────────────
# 배치 크기 산정 근거: DB 커넥션 풀 10 / 주문 평균 200ms = TPS 50 × 안전마진 0.6 = 30
# 토큰 TTL 근거: 사용자 평균 체류 35초, Access 180초(3분), Hard Limit 미적용(단순화)
queue:
  enabled: true
  batch-size: 30
  scheduler-interval-ms: 1000
  token-ttl-seconds: 180
  max-waiting-size: 100000

# ── Ranking (랭킹) ─────────────────────────────────────────────
# commerce-streamer와 동일한 키 prefix/TTL 설정
ranking:
  key-prefix: "ranking:all"
  ttl-days: 2
  hourly-key-prefix: "ranking:hourly"
  hourly-ttl-hours: 4

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false