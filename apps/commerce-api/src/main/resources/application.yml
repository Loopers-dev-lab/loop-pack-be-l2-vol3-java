server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

auth:
  admin:
    ldap-credential: admin-ldap

payment:
  toss:
    base-url: http://localhost:8090
    secret-key: test_sk_xxxx
    connect-timeout: 3000
    read-timeout: 5000
  nice:
    base-url: http://localhost:8091
    client-key: test_client_xxxx
    secret-key: test_sk_nice_xxxx
    connect-timeout: 3000
    read-timeout: 5000

resilience4j:
  circuitbreaker:
    configs:
      default-request:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 80
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - com.loopers.support.error.CoreException
      default-query:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 15s
        ignoreExceptions:
          - com.loopers.support.error.CoreException
    instances:
      toss-request:
        baseConfig: default-request
      nice-request:
        baseConfig: default-request
      toss-query:
        baseConfig: default-query
      nice-query:
        baseConfig: default-query
  retry:
    configs:
      default-query-retry:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
      default-cancel-retry:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
    instances:
      toss-query:
        baseConfig: default-query-retry
      nice-query:
        baseConfig: default-query-retry
      toss-cancel:
        baseConfig: default-cancel-retry
      nice-cancel:
        baseConfig: default-cancel-retry
  bulkhead:
    instances:
      pg-payment:
        maxConcurrentCalls: 20
        maxWaitDuration: 0

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

logging:
  level:
    io.github.resilience4j: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false