server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  cloud:
    openfeign:
      okhttp:
        enabled: true
      httpclient:
        max-connections: 200
        max-connections-per-route: 30
        time-to-live: 900
      client:
        config:
          pg-client:
            connect-timeout: 1000
            read-timeout: 2000

  task:
    execution:
      pool:
        core-size: 10
        max-size: 30
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: event-handler-

queue:
  enabled: true
  batch-size: 14
  interval-ms: 100
  token-ttl-seconds: 300
  throughput-per-second: 140
  max-size: 100000
  fallback-strategy: LOCAL_QUEUE

commerce-api:
  callback-base-url: http://localhost:8080

payment:
  scheduler:
    sync-interval-ms: 60000
    stale-requested-minutes: 10
    cb-fast-fail-expiry-minutes: 10

pg:
  simulator:
    url: http://localhost:8082

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      pg-request:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 60
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - java.io.IOException
          - com.loopers.infrastructure.payment.pg.PgServerException
        ignore-exceptions:
          - com.loopers.support.error.CoreException
      pg-query:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 60
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - java.io.IOException
          - com.loopers.infrastructure.payment.pg.PgServerException
        ignore-exceptions:
          - com.loopers.support.error.CoreException
  bulkhead:
    instances:
      pg-request:
        max-concurrent-calls: 20
  retry:
    retry-aspect-order: 2
    instances:
      pg-query:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.io.IOException
          - com.loopers.infrastructure.payment.pg.PgServerException

outbox:
  relay:
    delay-ms: 1000
    initial-delay-ms: 0
    limit: 100

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-shedlock.sql

---
spring:
  config:
    activate:
      on-profile: test

queue:
  enabled: false

outbox:
  relay:
    delay-ms: 86400000
    initial-delay-ms: 86400000
    lock-at-least-for: PT0S

---
spring:
  config:
    activate:
      on-profile: local
  sql:
    init:
      data-locations: classpath:data-local.sql

outbox:
  relay:
    delay-ms: 86400000
    initial-delay-ms: 86400000
    limit: 100
  jpa:
    defer-datasource-initialization: true
  cloud:
    openfeign:
      client:
        config:
          pg-client:
            logger-level: FULL

logging:
  level:
    com.loopers.infrastructure.payment.pg.PgClient: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd
  cloud:
    openfeign:
      client:
        config:
          pg-client:
            logger-level: BASIC

logging:
  level:
    com.loopers.infrastructure.payment.pg.PgClient: DEBUG

springdoc:
  api-docs:
    enabled: false