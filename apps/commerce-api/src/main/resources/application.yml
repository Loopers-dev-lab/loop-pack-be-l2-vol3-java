server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

pg:
  simulator:
    base-url: http://localhost:8082
    callback-base-url: http://localhost:8080

# ── Resilience4j ──────────────────────────────────────────────
# 데코레이터 순서 (바깥→안쪽): Bulkhead → CircuitBreaker → Retry → Timeout(RestTemplate)
# aspect order는 Resilience4jConfig.java에서 설정 (yml 미지원)
resilience4j:
  circuitbreaker:
    instances:
      pgPayment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 60s               # 함정7 방지: 0이면 느린 탐색 요청이 슬롯 점유 시 HALF_OPEN 무한 대기
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.loopers.domain.payment.PgServerException
          - com.loopers.domain.payment.PgTimeoutException
        ignore-exceptions:
          - com.loopers.domain.payment.PgClientException
          - com.loopers.support.error.CoreException

  bulkhead:
    instances:
      pgPayment:
        max-concurrent-calls: 20
        max-wait-duration: 0

  retry:
    instances:
      pgQuery:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.loopers.domain.payment.PgTimeoutException
          - com.loopers.domain.payment.PgServerException
        ignore-exceptions:
          - com.loopers.domain.payment.PgClientException

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false