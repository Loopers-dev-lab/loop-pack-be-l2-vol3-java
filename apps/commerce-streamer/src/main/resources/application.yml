server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-collector
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

loopers:
  kafka:
    topic:
      product-metrics: commerce.product.metrics.v1
      product-like-count: commerce.product.like-count.v1
      outbox-ack: commerce.outbox.ack.v1
      order-created: commerce.order.created.v1
      order-cancel-requested: commerce.order.cancel-requested.v1
      payment-status-changed: commerce.payment.status-changed.v1
      coupon-issue-requested: commerce.coupon.issue-requested.v1
  ranking:
    weight:
      view: 0.1
      like: 0.2
      sales: 0.7
    sync:
      enabled: true
      fixed-delay-ms: 60000
      immediate-increment-enabled: true
    carry-over:
      enabled: true
      ratio: 0.1
      daily-cron: "0 50 23 * * *"

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
