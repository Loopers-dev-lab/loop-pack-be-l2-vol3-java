server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-streamer
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  # 운영(ddl-auto: none)에서 collector 스키마는 classpath:db/migration (Flyway). local/test는 Hibernate create + Flyway 비활성.
  flyway:
    enabled: false

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1

# 쿠폰 비동기 발급: API 기본 consumer group 과 분리해 중복 처리 방지 (commerce-api 에는 동 토픽 리스너 없음)
coupon:
  issue:
    topic-name: coupon-issue-requests
    consumer-group: loopers-coupon-issue-consumer

collector:
  product:
    topic-name: product-events
    dlq-suffix: .DLQ
  order:
    topic-name: order-events
  user:
    topic-name: user-events
  # 경량 이벤트(USER_REGISTERED / BRAND_REGISTERED / CART_ITEM_ADDED): DB event_handled 없이 Redis SETNX 멱등.
  # Redis 장애 시: DB 폴백 없음 → 예외는 재시도/DLQ 정책으로 처리, Redis 복구 후 DLQ 재처리.
  # redis-ttl-days: 브로커 보존·consumer 최대 중단 허용 시간·lag보다 짧으면 TTL 이후 재전달 시 processed 지표가 중복될 수 있음.
  lightweight-idempotency:
    redis-ttl-days: 14
  # DB event_handled 행 보관: 멱등용 기술 로그(비즈니스 감사 아님). retention 이후 영구 삭제.
  event-handled-cleanup:
    enabled: true
    fixed-delay-ms: 3600000
    retention-days: 14
    batch-size: 500
    max-loops-per-run: 10
    max-rows-per-run: 100000

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev, qa, prd
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_streamer

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false