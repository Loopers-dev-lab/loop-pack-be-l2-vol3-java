server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml


ranking:
  weights:
    view: 0.1
    like: 0.2
    order: 0.7
  carry-over-rate: 0.1
  monthly-decay-rate: 0.97
  carry-over-cap: 10000
  category-priority: {}
  default-category-priority: 0
  experiment:
    enabled: false
    variants:
      A:
        weights: { view: 0.1, like: 0.2, order: 0.7 }
        zset-prefix: "ranking:exp:A:"
      B:
        weights: { view: 0.2, like: 0.3, order: 0.5 }
        zset-prefix: "ranking:exp:B:"

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false