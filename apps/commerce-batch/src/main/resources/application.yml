spring:
  main:
    web-application-type: none
  application:
    name: commerce-batch
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  batch:
    job:
      name: ${job.name:NONE}
    jdbc:
      initialize-schema: never

management:
  health:
    defaults:
      enabled: false

outbox:
  relay:
    enabled: true
    batch-size: 100
    send-ack-timeout: 5s
  dlq-redrive:
    enabled: false
    source-topic: product-events
    dlq-topic: product-events.DLQ
    parking-topic: product-events.DLQ.PARK
    group-id: outbox-dlq-redrive
    batch-size: 100
    max-attempts: 5
    poll-timeout: 1s
    send-ack-timeout: 5s
    fixed-delay-ms: 5000
  cleanup:
    enabled: true
    retention: 7d
    batch-size: 500
    max-deletes-per-run: 10000
    fixed-delay-ms: 3600000

---
spring:
  config:
    activate:
      on-profile: local, test
  batch:
    jdbc:
      initialize-schema: always

---
spring:
  config:
    activate:
      on-profile: test
outbox:
  cleanup:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false