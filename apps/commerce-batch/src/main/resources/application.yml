spring:
  main:
    web-application-type: none
  application:
    name: commerce-batch
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml
  batch:
    job:
      name: ${job.name:NONE}
    jdbc:
      initialize-schema: never

ranking:
  weight:
    view: 0.1
    like: 0.2
    order: 0.7

batch:
  rank:
    top-n: 100
    chunk-size: 20
    validation:
      fail-on-incomplete: false
    health-check:
      min-rows: 1
      max-variance-pct: 0.5
      fail-on-anomaly: false
    cleanup:
      batch-limit: 1000

management:
  health:
    defaults:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: local, test
  batch:
    jdbc:
      initialize-schema: always

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false