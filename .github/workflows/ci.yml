# T2: PR/푸시 시 전체 테스트를 실행한다. queue.order.require-entry-token=true 전용 E2E는
# OrderV1ApiEntryTokenE2ETest(@SpringBootTest properties)에 포함되어 동일 잡에서 회귀된다.
name: CI

on:
  push:
    branches: [main, master, develop, "feat/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests
        run: chmod +x gradlew && ./gradlew test --no-daemon --continue
