groups:
  - name: cdc-connect
    rules:
      - alert: CdcConnectorDown
        expr: absent(up{job="kafka-connect"} == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka Connect 메트릭 수집이 중단되었습니다"
          description: "Connect 다운 또는 Prometheus scrape 실패 여부를 확인하세요."

      - alert: CdcErrorTopicGrowing
        expr: rate(kafka_server_brokertopicmetrics_messagesin_total{topic="cdc-connect-errors"}[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CDC 에러 토픽 유입이 증가하고 있습니다"
          description: "connector 설정/스키마 변경/권한 문제를 점검하세요."
